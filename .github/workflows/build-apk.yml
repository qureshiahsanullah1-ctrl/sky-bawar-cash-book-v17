name: Build Android APK

on:
  push:
    branches: [ main, ahsanullahqureshi888-restore-backup-data ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Vite Web Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: npx cap sync android

      # Gzip files are for HTTP/CDN delivery. Android packages the original
      # web assets directly and treats each .gz sibling as a duplicate asset.
      - name: Remove HTTP-only compressed assets from Android bundle
        working-directory: frontend/android
        run: find app/src/main/assets/public -type f -name '*.gz' -delete

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cash-book-android-app
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
