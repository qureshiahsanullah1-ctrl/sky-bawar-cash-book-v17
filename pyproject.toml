# cspell:ignore fastapi uvicorn sqlalchemy pydantic openpyxl pyjwt pytest pythonpath testpaths httpx pg8000 backport
[project]
name = "app"
version = "2.1.0"
dependencies = [
 "fastapi>=0.141.1",
 "uvicorn[standard]>=0.52.4",
 "sqlalchemy>=2.0.52",
 "pydantic>=2.12.0",
 "python-multipart>=0.0.20",
 "openpyxl>=3.1.5",
 "bcrypt>=4.1.0",
 "pg8000>=1.31.2",
 "pyjwt>=2.8.0",
 "cryptography>=50.0.0",
 "python-jose[cryptography]>=3.5.0",
 "pandas>=3.0.5",
]
requires-python = "~=3.12.0"

[tool.pytest.ini_options]
pythonpath = [
  "backend"
]
testpaths = [
  "backend/tests",
  "backend/app/tests"
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
